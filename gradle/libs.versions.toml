[versions]
agp = "9.3.1"
kotlin = "2.3.20"
ksp = "2.3.11"
hilt = "2.60.1"
ktlint = "14.2.0"
jacoco = "0.8.14"
foojayResolver = "1.0.0"

# AndroidX & Material
androidx-annotation = "1.10.0"
androidx-appcompat = "1.8.0"
androidx-collection = "1.6.0"
androidx-core = "1.19.0"
androidx-core-splashscreen = "1.2.0"
androidx-fragment = "1.8.6"
androidx-lifecycle = "2.11.0"
androidx-media = "1.8.0"
androidx-swiperefreshlayout = "1.2.0"
androidx-savedstate = "1.5.0"
androidx-navigation = "2.9.8"
androidx-hilt-navigation-compose = "1.4.0"
androidx-datastore = "1.2.1"
androidx-activity = "1.13.0"
material = "1.14.0"
vico = "3.2.3"

# Compose
compose-bom = "2026.08.00"

# Testing
junit = "4.13.2"
junit-toolbox = "2.4"
androidx-test-ext = "1.3.0"
androidx-test-rules = "1.7.0"
androidx-espresso = "3.7.0"
assertj = "3.27.7"
hamcrest = "3.0"
kotlinx-coroutines = "1.10.1"
mockito = "5.23.0"
mockito-kotlin = "6.3.0"
robolectric = "4.16.1"
slf4j = "2.0.18"

[libraries]
# AndroidX & UI
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-collection-ktx = { module = "androidx.collection:collection-ktx", version.ref = "androidx-collection" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-core-splashscreen" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "androidx-fragment" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-media = { module = "androidx.media:media", version.ref = "androidx-media" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "androidx-swiperefreshlayout" }
google-material = { module = "com.google.android.material:material", version.ref = "material" }
vico-views = { module = "com.patrykandpatrick.vico:views", version.ref = "vico" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }

# Compose
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-activity = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
compose-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
compose-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
compose-savedstate-ktx = { module = "androidx.savedstate:savedstate-ktx", version.ref = "androidx-savedstate" }
compose-navigation = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }
compose-hilt-navigation = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidx-hilt-navigation-compose" }
compose-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }

# Unit Testing
test-junit = { module = "junit:junit", version.ref = "junit" }
test-junit-toolbox = { module = "com.googlecode.junit-toolbox:junit-toolbox", version.ref = "junit-toolbox" }
test-androidx-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
test-assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
test-hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }
test-kotlin = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
test-kotlin-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
test-kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
test-mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
test-mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }
test-robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
test-slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

# Android Instrumentation Testing
androidTest-espresso-contrib = { module = "androidx.test.espresso:espresso-contrib", version.ref = "androidx-espresso" }
androidTest-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidTest-androidx-ext-junit-ktx = { module = "androidx.test.ext:junit-ktx", version.ref = "androidx-test-ext" }
androidTest-androidx-rules = { module = "androidx.test:rules", version.ref = "androidx-test-rules" }
androidTest-assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
androidTest-hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojayResolver" }
